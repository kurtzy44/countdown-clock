<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Countdown Clock - Control</title><meta name="robots" content="noindex"><link rel="stylesheet" href="style.css"></head><body>
<div id="title"></div>
<div id="clock">
 <div class="unit" id="hu"><span id="hh">00</span><span class="lbl">Hours</span></div><span id="hc">:</span>
 <div class="unit"><span id="mm">00</span><span class="lbl">Minutes</span></div><span>:</span>
 <div class="unit"><span id="ss">00</span><span class="lbl">Seconds</span></div>
</div>
<div id="status"></div>
<div id="login" class="row">
 <input id="pw" type="password" placeholder="Password" style="width:180px">
 <button id="signin">Unlock controls</button>
</div>
<div id="controls" class="row hidden">
 <input id="t" placeholder="Title" style="width:180px">
 <input id="h" class="n" type="number" min="0" value="0"> h
 <input id="m" class="n" type="number" min="0" max="59" value="10"> m
 <input id="s" class="n" type="number" min="0" max="59" value="0"> s
 <button data-a="set">Set</button><button data-a="start">Start</button>
 <button data-a="pause">Pause</button><button data-a="reset">Reset</button>
 <button id="signout">Lock controls</button>
</div>
<script type="module">
import { controlEmail } from "./config.js";
import { app, timerRef, st, left, serverNow } from "./clock.js";
import { set } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
const auth = getAuth(app), $ = id => document.getElementById(id);
onAuthStateChanged(auth, u => { $("login").classList.toggle("hidden", !!u); $("controls").classList.toggle("hidden", !u); });
$("signin").onclick = () => signInWithEmailAndPassword(auth, controlEmail, $("pw").value)
  .catch(() => $("status").textContent = "Sign-in failed. Check the password.");
$("pw").addEventListener("keydown", e => { if (e.key === "Enter") $("signin").click(); });
$("signout").onclick = () => signOut(auth);
function act(a) {
  const cur = { duration: st.duration, remaining: st.remaining, endAt: st.endAt || null, title: st.title || "" };
  const l = left();
  if (a === "set") { const ms = ((+$("h").value||0)*3600 + (+$("m").value||0)*60 + (+$("s").value||0))*1000;
    Object.assign(cur, { duration: ms, remaining: ms, endAt: null, title: $("t").value }); }
  else if (a === "start") { if (cur.endAt || l <= 0) return; cur.endAt = serverNow() + l; }
  else if (a === "pause") { if (!cur.endAt) return; cur.remaining = l; cur.endAt = null; }
  else if (a === "reset") { cur.remaining = cur.duration; cur.endAt = null; }
  set(timerRef, cur).catch(() => $("status").textContent = "Not allowed. Are you signed in?");
}
document.querySelectorAll("[data-a]").forEach(b => b.onclick = () => act(b.dataset.a));
document.addEventListener("keydown", e => { if (e.target.tagName === "INPUT" || !auth.currentUser) return;
  if (e.key === " ") { act(st.endAt ? "pause" : "start"); e.preventDefault(); } if (e.key === "r") act("reset"); });
</script>
</body></html>
